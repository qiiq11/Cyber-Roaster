server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA 前端路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 反向代理后端 API（无尾斜杠前缀匹配，覆盖 /roast 与 /roast/123）
    location /roast {
        proxy_pass http://backend:8000;
    }
    location /stats {
        proxy_pass http://backend:8000;
    }
    location /github {
        proxy_pass http://backend:8000;
    }
    location /meme {
        proxy_pass http://backend:8000;
    }
    location /health {
        proxy_pass http://backend:8000;
    }
}
