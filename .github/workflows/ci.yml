name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-test:
    name: 代码检查与测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: src/backend/requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 代码格式检查（black）
        run: black --check app tests

      - name: 代码规范检查（flake8）
        run: flake8 app tests --max-line-length=100 --extend-ignore=E203,W503

      - name: 运行测试（pytest + 覆盖率）
        run: pytest

  build-images:
    name: 构建镜像
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 构建后端镜像
        working-directory: src/backend
        run: docker build -t cyber-roaster-backend .

      - name: 构建前端镜像
        working-directory: src/frontend
        run: docker build -t cyber-roaster-frontend .
